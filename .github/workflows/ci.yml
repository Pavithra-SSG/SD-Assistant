# Runs on every push and pull request: the full test suite on SQLite and on Postgres, then a Docker build.
# Tests use the offline mock brain, so no TypeSafe key is needed here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: sdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:testpw@localhost:5432/sdtest' || '' }}
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t servicedesk:ci .
      - name: Image refuses to start without production secrets
        run: |
          if docker run --rm servicedesk:ci python -c "import servicedesk.config" 2>err.txt; then
            echo "expected a ConfigError without JWT_SECRET"; exit 1
          fi
          grep -q "JWT_SECRET is required" err.txt
